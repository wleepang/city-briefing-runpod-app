worker_processes 1;
pid /run/nginx.pid;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen 8080;
        client_max_body_size 30m;

        # Runpod polls /ping: 200 = ready, 204 = still starting, anything else = unhealthy.
        location = /ping {
            proxy_pass http://127.0.0.1:8081/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @starting;
        }
        location @starting { return 204; }

        # Everything else goes straight to llama-server, unbuffered so streamed answers arrive as they are written.
        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
